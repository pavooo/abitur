{% extends "adminbereich/base.html" %}

{% block title %}Import{% endblock %}

{% block admin_content %}
<h1 class="mb-6 text-xl font-semibold">Import-Paket hochladen</h1>
<form method="post" enctype="multipart/form-data" class="max-w-sm space-y-4">
  {% csrf_token %}
  {% include "includes/form_fields.html" %}
  <button type="submit" class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
    Hochladen &amp; prüfen
  </button>
</form>
{% endblock %}
