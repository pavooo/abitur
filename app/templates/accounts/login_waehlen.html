{% extends "base.html" %}

{% block title %}Anmelden{% endblock %}

{% block content %}
<h1 class="mb-6 text-xl font-semibold">Anmeldung</h1>
<div class="grid gap-6 sm:grid-cols-2">
  <a href="{% url 'accounts:code_login' %}"
     class="block rounded-lg border border-slate-200 bg-white p-6 shadow-sm hover:border-slate-400">
    <h2 class="text-lg font-semibold">Ich bin Schüler/in</h2>
    <p class="mt-2 text-sm text-slate-600">Anmeldung mit Zugangscode.</p>
  </a>
  <a href="{% url 'accounts:lehrkraft_login' %}"
     class="block rounded-lg border border-slate-200 bg-white p-6 shadow-sm hover:border-slate-400">
    <h2 class="text-lg font-semibold">Ich bin Lehrkraft</h2>
    <p class="mt-2 text-sm text-slate-600">Anmeldung mit E-Mail und Passwort.</p>
  </a>
</div>
{% endblock %}
